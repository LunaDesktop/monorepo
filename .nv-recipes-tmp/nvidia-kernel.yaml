pkgname: 'nvidia-kernel'
pkgver: '615.78.08'
pkgrel: '1'
pkgdesc: 'NVIDIA kernel modules (nvidia, nvidia-modeset, nvidia-uvm, nvidia-drm) prebuilt against the Pagan rolling `kernel` package.'
url: 'https://www.nvidia.com/en-us/drivers/unix/'
arch: x86_64
license:
- custom

depends:
- 'kernel'

makedepends:
- 'kernel'

source:
- 'https://us.download.nvidia.com/XFree86/Linux-x86_64/${pkgver}/NVIDIA-Linux-x86_64-${pkgver}.run'

sha256sums:
- 3e3f6dddc2ee767a08185300af7be3cb286ece76698d2dde3524599782d07ffe

# Auto-detekcja wersji dla `pagsync --check-updates` (patrz komentarz
# w recepturze nvidia-dkms – heurystyka pagsync nie rozpoznaje nazw plików
# NVIDIA i dlatego receptury nie podbijały się same).
update:
  type: script
  script: |
    curl -fsSL https://us.download.nvidia.com/XFree86/Linux-x86_64/ 2>/dev/null \
      | grep -oE '[0-9]{3}\.[0-9]{2}\.[0-9]{2}' | sort -V | tail -1

hooks:
  # Po instalacji modułów trzeba przeliczyć modules.dep/aliases, żeby
  # `modprobe nvidia-drm` (reguła udev autoload) znalazł moduł.
  'post-install': |
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    for _m in /usr/lib/modules/*; do
      [ -d "$_m" ] || continue
      _krel=$(basename "$_m")
      if [ -e "$_m/kernel/drivers/video/nvidia.ko" ] || [ -e "$_m/kernel/drivers/video/nvidia.ko.zst" ]; then
        depmod -a "$_krel" 2>/dev/null || true
      fi
    done
    # Initramfs nie zawiera modułów NVIDII (ładowane przez udev po starcie),
    # ale po podmianie modułów warto odświeżyć aliasy w obrazie.
    if command -v pagan-initramfs >/dev/null 2>&1; then pagan-initramfs >/dev/null 2>&1 || true; fi
  'pre-remove': |
    depmod -a 2>/dev/null || true

build: |
  sh NVIDIA-Linux-x86_64-${pkgver}.run --extract-only
  cd NVIDIA-Linux-x86_64-${pkgver}/kernel

  # Wersja jądra docelowego (vermagic) bierzemy z DRZEWA ŹRÓDEŁ pakietu `kernel`,
  # a NIE z jądra buildera – inaczej `modprobe` odrzuciłby moduł (vermagic).
  _krel=$(cat /usr/src/kernel/include/config/kernel.release 2>/dev/null || true)
  [ -n "$_krel" ] || _krel=$(make -s -C /usr/src/kernel kernelrelease)
  [ -n "$_krel" ] || { echo "BŁĄD: nie ustalono wersji jądra z /usr/src/kernel" >&2; exit 1; }

  SYSSRC=/usr/src/kernel make modules

  _dest="${PKGDIR}/usr/lib/modules/${_krel}/kernel/drivers/video"
  install -dm0755 "$_dest"
  install -m0644 *.ko "$_dest"/

package: |
  true

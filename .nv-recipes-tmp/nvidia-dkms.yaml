pkgname: nvidia-dkms
pkgver: '615.78.08'
pkgrel: '2'
pkgdesc: NVIDIA userspace drivers (libGLX, libEGL, Vulkan ICD, nvidia-smi) + DKMS kernel module sources, Xorg config and udev rules
url: https://www.nvidia.com/en-us/drivers/unix/
arch: x86_64
license:
- custom

# `kernel` (nie `linux-headers`) daje /usr/src/kernel + symlink build/source w
# /usr/lib/modules/<ver> – to jest SYSSRC, którego używa DKMS przy instalacji.
depends:
- kernel
- dkms
- at-spi2-core
- cairo
- egl-wayland
- gdk-pixbuf
- glib
- gtk2
- gtk3
- libglvnd
- openssl
- pango
- wayland
- xorg-libx11
- xorg-libxext

makedepends:
- grep
- binutils

source:
- https://us.download.nvidia.com/XFree86/Linux-x86_64/${pkgver}/NVIDIA-Linux-x86_64-${pkgver}.run
sha256sums:
- 3e3f6dddc2ee767a08185300af7be3cb286ece76698d2dde3524599782d07ffe

# Auto-detekcja wersji dla `pagsync --check-updates`.
#
# Domyślna heurystyka pagsync NIE wykrywa NVIDIA i dlatego receptury stały
# w miejscu: szuka pliku `<pkgname>-<wersja>.tar.gz` w listingu katalogu
# źródła, a NVIDIA publikuje `NVIDIA-Linux-x86_64-<wersja>.run` w katalogu
# o nazwie równej wersji. Ten skrypt zwraca najwyższą wersję z listingu
# (uwaga: wybiera też gałęzie „new feature” – jeśli chcesz tylko gałąź
# produkcyjną, ogranicz wzorzec, np. `6[01][0-9]\.`).
update:
  type: script
  script: |
    curl -fsSL https://us.download.nvidia.com/XFree86/Linux-x86_64/ 2>/dev/null \
      | grep -oE '[0-9]{3}\.[0-9]{2}\.[0-9]{2}' | sort -V | tail -1

build: |
  sh NVIDIA-Linux-x86_64-${pkgver}.run --extract-only
  cd NVIDIA-Linux-x86_64-${pkgver}
  _nvdir="${PWD}"

  # ═══ CZĘŚĆ 1/3: USERSPACE (biblioteki GL/EGL/Vulkan, binarki, DDX) ═══
  install -dm0755 ${PKGDIR}/usr/lib
  install -dm0755 ${PKGDIR}/usr/bin
  install -dm0755 ${PKGDIR}/usr/share/{applications,pixmaps,man/man1,doc/nvidia}
  install -dm0755 ${PKGDIR}/usr/share/glvnd/egl_vendor.d
  install -dm0755 ${PKGDIR}/usr/share/vulkan/icd.d
  install -dm0755 ${PKGDIR}/usr/lib/xorg/modules/{drivers,extensions}

  # ── Biblioteki ────────────────────────────────────────────────────────────
  # UWAGA: glob `*.so.${pkgver}` BYŁ BŁĘDNY. Część bibliotek NVIDII ma WŁASNĄ
  # wersję, niezależną od wersji drivera:
  #   libnvidia-egl-gbm.so.1.1.3      (EGL_PLATFORM_GBM — zero-copy/skanout)
  #   libnvidia-egl-wayland2.so.1.0.1 (Wayland bez EGLStream)
  #   libnvidia-egl-xcb.so.1.0.5 / libnvidia-egl-xlib.so.1.0.5
  #   libnvidia-nvvm70.so.4           (JIT CUDA)
  # Stary glob je pomijał — dlatego w systemie brakowało `libnvidia-egl-gbm`
  # i kompozytor nie mógł użyć GBM (zero-copy), mimo że plik jest w archiwum.
  #
  # Wykluczamy natomiast:
  #  - stuby GLVND/OpenCL (`libEGL.so.*`, `libGL.so.*`, …) — dostarcza je
  #    `libglvnd`/`ocl-icd`; podmiana ich symlinkiem NVIDII psuje vendor selection,
  #  - `libnvidia-egl-wayland.so.*` — właścicielem jest pakiet `egl-wayland`
  #    (budowany ze źródeł 1.1.24); inaczej konflikt plików,
  #  - `libglxserver_nvidia.so.*` — instalujemy go tylko do katalogu Xorg.
  for _lib in *.so.*; do
    case "$_lib" in
      libEGL.so.*|libGL.so.*|libGLX.so.*|libGLdispatch.so.*|libGLESv1_CM.so.*|libGLESv2.so.*|libOpenGL.so.*|libOpenCL.so.*) continue ;;
      libnvidia-egl-wayland.so.*) continue ;;
      libglxserver_nvidia.so.*) continue ;;
    esac
    install -m 0755 "$_lib" ${PKGDIR}/usr/lib/
  done

  # nvidia-smi, nvidia-settings, nvidia-xconfig, nvidia-modprobe, nvidia-persistenced
  for _bin in nvidia-smi nvidia-settings nvidia-xconfig nvidia-modprobe nvidia-persistenced; do
    [ -f "$_bin" ] && install -m 0755 "$_bin" ${PKGDIR}/usr/bin/
  done

  # Man pages
  for _man in nvidia-smi nvidia-settings nvidia-xconfig nvidia-modprobe nvidia-persistenced; do
    [ -f "${_man}.1.gz" ] && install -m 0644 "${_man}.1.gz" ${PKGDIR}/usr/share/man/man1/
  done

  # Desktop entry + ikona
  if [ -f nvidia-settings.desktop ]; then
    sed -e "s@__UTILS_PATH__/@/usr/bin/@g" -e "s@__PIXMAP_PATH__/@/usr/share/pixmaps/@g" \
      nvidia-settings.desktop > ${PKGDIR}/usr/share/applications/nvidia-settings.desktop
  fi
  [ -f nvidia-settings.png ] && install -m 0644 nvidia-settings.png ${PKGDIR}/usr/share/pixmaps/

  # Xorg DDX + rozszerzenie GLX
  [ -f nvidia_drv.so ] && install -m 0755 nvidia_drv.so ${PKGDIR}/usr/lib/xorg/modules/drivers/
  if [ -f libglxserver_nvidia.so.${pkgver} ]; then
    install -m 0755 libglxserver_nvidia.so.${pkgver} ${PKGDIR}/usr/lib/xorg/modules/extensions/
    ln -sf libglxserver_nvidia.so.${pkgver} ${PKGDIR}/usr/lib/xorg/modules/extensions/libglxserver_nvidia.so
  fi

  # EGL vendor (GLVND)
  if [ -f 10_nvidia.json ]; then
    install -m 0644 10_nvidia.json ${PKGDIR}/usr/share/glvnd/egl_vendor.d/
  fi

  # Vulkan ICD do icd.d
  if [ -f nvidia_icd.json ]; then
    install -m 0644 nvidia_icd.json ${PKGDIR}/usr/share/vulkan/icd.d/
  fi
  if [ -f nvidia_layers.json ]; then
    install -dm0755 ${PKGDIR}/usr/share/vulkan/explicit_layer.d
    install -m 0644 nvidia_layers.json ${PKGDIR}/usr/share/vulkan/explicit_layer.d/
  fi

  # ── EGL external platforms ────────────────────────────────────────────────
  # `10_nvidia_wayland.json` należy do pakietu `egl-wayland` — nie dublujemy.
  # Pozostałe platformy są tylko w archiwum NVIDII: GBM (zero-copy), XCB, Xlib
  # oraz nowa „wayland2” (bez EGLStream).
  install -dm0755 ${PKGDIR}/usr/share/egl/egl_external_platform.d
  for _j in 09_nvidia_wayland2.json 15_nvidia_gbm.json 20_nvidia_xcb.json 20_nvidia_xlib.json; do
    [ -f "$_j" ] && install -m 0644 "$_j" ${PKGDIR}/usr/share/egl/egl_external_platform.d/
  done

  # ── Mesa GBM: backend `nvidia-drm_gbm.so` ─────────────────────────────────
  # Dokładnie tak robi instalator NVIDII i runtime Flatpaka: to DOWIĄZANIE do
  # `libnvidia-allocator`. Bez tego pliku `gbm_create_device()` na NVIDIA nie
  # działa, więc nie ma alokacji buforów skanoutu (zero-copy).
  install -dm0755 ${PKGDIR}/usr/lib/gbm
  ln -sf ../libnvidia-allocator.so.${pkgver} ${PKGDIR}/usr/lib/gbm/nvidia-drm_gbm.so

  # Dokumentacja
  if [ -d "${_nvdir}/html" ]; then
    cp -r "${_nvdir}"/html/* ${PKGDIR}/usr/share/doc/nvidia/ 2>/dev/null || true
  fi

  # Symlinki SONAME dla WSZYSTKICH zainstalowanych bibliotek (także tych
  # z własną wersją: egl-gbm 1.1.3, egl-xcb/xlib 1.0.5, nvvm70.so.4).
  cd ${PKGDIR}/usr/lib
  for _lib in *.so.*; do
    [ -f "$_lib" ] || continue
    _soname=$(readelf -d "$_lib" 2>/dev/null | awk -F'[][]' '/SONAME/{print $2}')
    if [ -n "$_soname" ] && [ ! -e "$_soname" ]; then
      ln -sf "$_lib" "$_soname"
    fi
    _base=$(echo "$_lib" | sed -E 's/\.so\.[0-9.]+$/.so/')
    if [ "$_base" != "$_lib" ] && [ ! -e "$_base" ]; then
      ln -sf "$_lib" "$_base"
    fi
  done

  # ── firmware GSP z tego samego .run (np. gsp_tu10x.bin) ────────────────
  if [ -d "${_nvdir}/firmware" ]; then
    install -dm0755 "${PKGDIR}/lib/firmware/nvidia/${pkgver}"
    install -m0644 "${_nvdir}"/firmware/* "${PKGDIR}/lib/firmware/nvidia/${pkgver}/"
  fi

  # ═══ CZĘŚĆ 2/3: ŹRÓDŁA DKMS ═══
  # Zawartość ${_nvdir}/kernel/ (Makefile, Kbuild oraz katalogi nvidia/,
  # nvidia-uvm/, nvidia-modeset/, nvidia-drm/) kopiujemy DO ${_srcdir}/, więc
  # Makefile leży w katalogu głównym drzewa DKMS – dlatego BUILT_MODULE_LOCATION
  # to "." (a NIE "kernel"; taki katalog w rozwiązanym drzewie nie istnieje).
  _srcdir="${PKGDIR}/usr/src/nvidia-${pkgver}"
  install -dm0755 "${_srcdir}"
  cp -r "${_nvdir}"/kernel/* "${_srcdir}/"

  # UWAGA: MAKE[0] jest OBOWIĄZKOWE. Bez niego DKMS dokłada `KERNELRELEASE=...`
  # do polecenia make, a Makefile NVIDII wybiera wtedy gałąź "budowane przez
  # Kbuild" (`ifneq ($(KERNELRELEASE),)` → include $(src)/Kbuild) i NIE tworzy
  # żadnego .ko. DKMS kończy to błędem:
  #   Error! Build of ./nvidia.ko failed ... name and location of the generated
  #   module ...
  # Cudzysłowy wokół 'make' tłumią dodawanie KERNELRELEASE, a KERNEL_UNAME=
  # ${kernelver} wskazuje jądro DOCELOWE (a nie to, na którym działa DKMS).
  # Wzorzec z autorytatywnego kernel/dkms.conf z instalatora NVIDII.
  cat > "${_srcdir}/dkms.conf" << 'EOF'
  PACKAGE_NAME="nvidia"
  PACKAGE_VERSION="@PKGVER@"
  AUTOINSTALL="yes"

  MAKE[0]="'make' -j4 NV_EXCLUDE_BUILD_MODULES='nvidia-peermem' NV_EXCLUDE_KERNEL_MODULES='nvidia-peermem nvidia-vgpu-vfio' KERNEL_UNAME=${kernelver} modules"

  BUILT_MODULE_NAME[0]="nvidia"
  BUILT_MODULE_LOCATION[0]="."
  DEST_MODULE_LOCATION[0]="/kernel/drivers/video"

  BUILT_MODULE_NAME[1]="nvidia-uvm"
  BUILT_MODULE_LOCATION[1]="."
  DEST_MODULE_LOCATION[1]="/kernel/drivers/video"

  BUILT_MODULE_NAME[2]="nvidia-modeset"
  BUILT_MODULE_LOCATION[2]="."
  DEST_MODULE_LOCATION[2]="/kernel/drivers/video"

  BUILT_MODULE_NAME[3]="nvidia-drm"
  BUILT_MODULE_LOCATION[3]="."
  DEST_MODULE_LOCATION[3]="/kernel/drivers/video"
  EOF

  # PACKAGE_VERSION musi być AKTUALNY: DKMS identyfikuje moduł po tej wartości,
  # a hooki liczą wersję z /usr/src/nvidia-<ver>. Stała „610.57.04” po podbiciu
  # pkgver wskazywałaby nieistniejący katalog źródła.
  sed -i "s|@PKGVER@|${pkgver}|" "${_srcdir}/dkms.conf"

  # ═══ CZĘŚĆ 3/3: KONFIGURACJA SYSTEMOWA ═══
  install -dm0755 ${PKGDIR}/usr/lib/udev/rules.d
  install -dm0755 ${PKGDIR}/etc/modprobe.d
  install -dm0755 ${PKGDIR}/etc/X11/xorg.conf.d

  cat > ${PKGDIR}/etc/X11/xorg.conf.d/10-nvidia-drm.conf << 'EOF'
  Section "OutputClass"
      Identifier "nvidia"
      MatchDriver "nvidia-drm"
      Driver "nvidia"
      Option "AllowEmptyInitialConfiguration"
  EndSection
  EOF

  cat > ${PKGDIR}/etc/modprobe.d/nvidia-drm.conf << 'EOF'
  options nvidia-drm modeset=1
  EOF

  cat > ${PKGDIR}/usr/lib/udev/rules.d/99-pagan-nvidia-autoload.rules << 'EOF'
  ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x10de", ATTR{class}=="0x030000", RUN+="/usr/sbin/modprobe nvidia-drm"
  ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x10de", ATTR{class}=="0x030200", RUN+="/usr/sbin/modprobe nvidia-drm"
  EOF

  # Poprawne węzły /dev/nvidia*: NVIDIA 6xx rejestruje nvidiactl,
  # nvidia-modeset (a nie nvidia-frontend, którego używa stara reguła).
  install -dm0755 ${PKGDIR}/lib/udev/rules.d
  cat > ${PKGDIR}/lib/udev/rules.d/60-nvidia.rules << 'EOF'
  KERNEL=="nvidia", RUN+="/usr/bin/bash -c '/usr/bin/mknod -Z -m 666 /dev/nvidiactl c $$(grep -w nvidiactl /proc/devices | cut -d \  -f 1) 255'"
  KERNEL=="nvidia", RUN+="/usr/bin/bash -c 'for i in $$(cat /proc/driver/nvidia/gpus/*/information | grep Minor | cut -d \  -f 4); do /usr/bin/mknod -Z -m 666 /dev/nvidia$${i} c $$(grep -w nvidiactl /proc/devices | cut -d \  -f 1) $${i}; done'"
  KERNEL=="nvidia_modeset", RUN+="/usr/bin/bash -c '/usr/bin/mknod -Z -m 666 /dev/nvidia-modeset c $$(grep -w nvidia-modeset /proc/devices | cut -d \  -f 1) 254'"
  KERNEL=="nvidia_uvm", RUN+="/usr/bin/bash -c '/usr/bin/mknod -Z -m 666 /dev/nvidia-uvm c $$(grep -w nvidia-uvm /proc/devices | cut -d \  -f 1) 0'"
  KERNEL=="nvidia_uvm", RUN+="/usr/bin/bash -c '/usr/bin/mknod -Z -m 666 /dev/nvidia-uvm-tools c $$(grep -w nvidia-uvm /proc/devices | cut -d \  -f 1) 1'"
  EOF

  cat > ${PKGDIR}/etc/modprobe.d/nouveau.conf << 'EOF'
  blacklist nouveau
  options nouveau modeset=0
  EOF

  # ── Helper hooków: moduły dla jąder BEZ pakietu nvidia-kernel ─────────────
  # Stary hook robił to synchronicznie, a `pag` ubija hook po PAG_HOOK_TIMEOUT
  # (60 s) → w audit logu „hook TIMEOUT post-install nvidia-dkms”, jądro bez
  # modułów i DRUGI zestaw .ko z DKMS obok modułów z nvidia-kernel (nvidia.ko
  # i nvidia.ko.zst w tym samym katalogu). Tu budowanie idzie w tło, a jądra
  # z gotowymi modułami dostają tylko `depmod`.
  install -dm0755 ${PKGDIR}/usr/lib/pagan
  cat > ${PKGDIR}/usr/lib/pagan/nvidia-modules-ensure << 'NVHELPER'
  #!/bin/sh
  # nvidia-modules-ensure – dogranie modułów NVIDII dla jąder, dla których
  # pakiet nvidia-kernel nie dostarcza gotowych .ko (własne jądra, kernel-lts,
  # jądra po rollbacku). Wołane z hooków pakietu nvidia-dkms.
  #
  # Kompilacja NVIDII trwa minuty, a `pag` ubija hook po PAG_HOOK_TIMEOUT
  # (domyślnie 60 s) – dlatego budowanie brakujących jąder idzie w TLE.
  set -u
  export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  
  action="${1:-install}"
  
  # Wersja z drzewa DKMS, nie zaszyta w hooku: przy każdym wydaniu drivera
  # pkgver się zmienia i stała w hooku wskazywałaby nieistniejący katalog.
  ver=$(ls -d /usr/src/nvidia-[0-9]* 2>/dev/null | sed 's|.*/nvidia-||' | sort -V | tail -1)
  if [ -z "$ver" ]; then
      echo "nvidia-modules-ensure: brak źródeł w /usr/src/nvidia-* – pomijam"
      exit 0
  fi
  
  if [ "$action" = "remove" ]; then
      dkms remove -m nvidia -v "$ver" --all >/dev/null 2>&1 || true
      depmod -a >/dev/null 2>&1 || true
      exit 0
  fi
  
  if [ ! -d /usr/src/kernel ] && [ ! -d "/lib/modules/$(uname -r)/build" ]; then
      echo "nvidia-modules-ensure: brak źródeł jądra – zainstaluj pakiet kernel"
      exit 0
  fi
  
  # Usuń moduły DKMS STARYCH wersji drivera. `pag` przy aktualizacji uruchamia
  # tylko pre/post-install (pre-remove leci wyłącznie przy `pag remove`), więc
  # .ko.zst z poprzedniego wydania zostają w /usr/lib/modules/<krel>/… obok
  # nowych .ko z nvidia-kernel – modprobe mógłby wczytać nvidia.ko ze starej
  # wersji i dostać „Driver/library version mismatch”.
  for d in /var/lib/dkms/nvidia/*/; do
      [ -d "$d" ] || continue
      old=${d%/}; old=${old##*/}
      [ "$old" = "$ver" ] && continue
      case "$old" in [0-9]*) ;; *) continue ;; esac
      dkms remove -m nvidia -v "$old" --all >/dev/null 2>&1 || true
  done
  
  dkms add -m nvidia -v "$ver" >/dev/null 2>&1 || true
  
  # Pliki zarządzane przez pakiet nvidia-kernel – tylko je wolno zostawić.
  owned=$(pag files nvidia-kernel 2>/dev/null | sed -n 's/^[[:space:]]*\(\/.*\)$/\1/p')
  # Gdy `pag` nie odpowie albo nvidia-kernel nie jest zainstalowany, NIE
  # usuwamy niczego (nie wiemy, co jest czyje) – wolimy zostawić stan zastany.
  pkg_owned() { [ -n "$owned" ] || return 0; printf '%s\n' "$owned" | grep -Fxq "$1"; }
  
  missing=""
  for m in /usr/lib/modules/*; do
      [ -d "$m" ] || continue
      krel=${m##*/}
      dir=$m/kernel/drivers/video
      # DKMS dla tego jądra ma sens tylko wtedy, gdy drzewo źródeł w
      # /usr/lib/modules/<krel>/build odpowiada <krel>. Hook pakietu `kernel`
      # podpina WSZYSTKIM jądrom to samo /usr/src/kernel, więc budowa „na siłę”
      # dałaby moduł z vermagic innego jądra (modprobe by go odrzucił).
      kbuild=$(cat "$m/build/include/config/kernel.release" 2>/dev/null)
      # (1) jądro bez żadnych modułów NVIDII → DKMS
      if [ ! -e "$dir/nvidia.ko" ] && [ ! -e "$dir/nvidia.ko.zst" ]; then
          if [ "$kbuild" = "$krel" ]; then
              missing="$missing $krel"
          else
              echo "nvidia-modules-ensure: $krel bez modułów i bez pasujących źródeł – pomijam"
          fi
          continue
      fi
      # (2) wersja modułów obecnych w tym jądrze
      cur=""
      for f in "$dir/nvidia.ko" "$dir/nvidia.ko.zst"; do
          [ -e "$f" ] || continue
          cur=$(modinfo -F version "$f" 2>/dev/null) || cur=""
          [ -n "$cur" ] && break
      done
      if [ "$cur" = "$ver" ]; then
          # Duplikat: .ko z pakietu + .ko.zst z DKMS (starsze hooki instalowały
          # DKMS zawsze, także tam, gdzie pakiet dawał gotowe moduły).
          if [ -e "$dir/nvidia.ko" ]; then
              rm -f "$dir"/nvidia.ko.zst "$dir"/nvidia-drm.ko.zst \
                    "$dir"/nvidia-modeset.ko.zst "$dir"/nvidia-uvm.ko.zst
          fi
          depmod -a "$krel" >/dev/null 2>&1 || true
          continue
      fi
      # (3) moduły w innej wersji. Pozostałości po dawnych wydaniach pakietu
      # (nie należą do żadnego zainstalowanego pakietu) usuwamy i wstawiamy
      # moduły DKMS – inaczej po podbiciu drivera jest mismatch z bibliotekami.
      if [ "$kbuild" != "$krel" ]; then
          echo "nvidia-modules-ensure: $krel ma moduły $cur, brak źródeł tej wersji jądra – zostawiam"
          continue
      fi
      stale=""
      for f in "$dir"/nvidia.ko "$dir"/nvidia.ko.zst \
               "$dir"/nvidia-drm.ko "$dir"/nvidia-drm.ko.zst \
               "$dir"/nvidia-modeset.ko "$dir"/nvidia-modeset.ko.zst \
               "$dir"/nvidia-uvm.ko "$dir"/nvidia-uvm.ko.zst; do
          [ -e "$f" ] || continue
          pkg_owned "$f" && stale="$stale $f" && continue
          rm -f "$f" || stale="$stale $f"
      done
      if [ -n "$stale" ]; then
          echo "nvidia-modules-ensure: $krel ma moduły $cur z pakietu – pomijam DKMS"
      else
          missing="$missing $krel"
      fi
  done
  
  if [ -n "$missing" ]; then
      job="for k in$missing; do dkms build -m nvidia -v $ver -k \"\$k\" && dkms install -m nvidia -v $ver -k \"\$k\" --force; done; depmod -a; pagan-initramfs"
      echo "nvidia-modules-ensure: brak modułów dla:$missing – budowanie w tle"
      if command -v systemd-run >/dev/null 2>&1 && \
         systemd-run --no-block --collect --unit="pagan-nvidia-dkms-$$" \
                     /bin/sh -c "$job" >/dev/null 2>&1; then
          :
      elif command -v setsid >/dev/null 2>&1; then
          setsid /bin/sh -c "$job" >/dev/null 2>&1 &
      else
          nohup /bin/sh -c "$job" >/dev/null 2>&1 &
      fi
  fi
  
  # Initramfs i cache ld.so odświeżamy ZAWSZE po zmianie drivera – inaczej
  # moduły zostają na starym jądrze, a libGLX_nvidia nie jest widoczny.
  if command -v pagan-initramfs >/dev/null 2>&1; then
      pagan-initramfs >/dev/null 2>&1 || true
  fi
  command -v ldconfig >/dev/null 2>&1 && ldconfig >/dev/null 2>&1 || true
  udevadm control --reload-rules >/dev/null 2>&1 || true
  exit 0
  NVHELPER
  chmod 0755 ${PKGDIR}/usr/lib/pagan/nvidia-modules-ensure

hooks:
  post-install: |
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    [ -x /usr/lib/pagan/nvidia-modules-ensure ] && \
      /usr/lib/pagan/nvidia-modules-ensure install || true
  pre-remove: |
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    [ -x /usr/lib/pagan/nvidia-modules-ensure ] && \
      /usr/lib/pagan/nvidia-modules-ensure remove || true
  post-upgrade: |
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    [ -x /usr/lib/pagan/nvidia-modules-ensure ] && \
      /usr/lib/pagan/nvidia-modules-ensure install || true

package: |
  true

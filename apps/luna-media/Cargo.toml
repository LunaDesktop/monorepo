[package]
name = "luna-media"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
description = "Luna Media — przeglądarka obrazów, RAW-ów, filmów i PDF-ów środowiska Luna (libLuna, bez GTK; ffmpeg + poppler)."

[workspace]
resolver = "2"

[dependencies]
libluna-core = { path = "../../libluna/crates/libluna-core", version = "0.0.5" }
libluna-i18n = { path = "../../libluna/crates/libluna-i18n", version = "0.0.5" }
libluna-render = { path = "../../libluna/crates/libluna-render", version = "0.0.5" }
libluna-platform = { path = "../../libluna/crates/libluna-platform", version = "0.0.5" }
libluna-widgets = { path = "../../libluna/crates/libluna-widgets", version = "0.0.5" }
jpeg-decoder = { version = "0.3", default-features = false }
resvg = { version = "0.44", default-features = false }
libc = "0.2"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "luna-terminal"
version = "0.0.6"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
description = "Luna Terminal — emulator terminala środowiska Luna (libLuna, PTY, VT100/xterm)."
# Po utworzeniu osobnego repozytorium ustaw np.:
# repository = "https://github.com/mijsys/luna-terminal"

[workspace]
resolver = "2"

[dependencies]
libluna-core = { path = "../../libluna/crates/libluna-core", version = "0.0.8" }
libluna-i18n = { path = "../../libluna/crates/libluna-i18n", version = "0.0.8" }
libluna-render = { path = "../../libluna/crates/libluna-render", version = "0.0.8" }
libluna-platform = { path = "../../libluna/crates/libluna-platform", version = "0.0.8" }
libluna-widgets = { path = "../../libluna/crates/libluna-widgets", version = "0.0.8" }
libc = "0.2"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

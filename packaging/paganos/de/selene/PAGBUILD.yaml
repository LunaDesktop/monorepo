# Receptura PaganOS (pagbuild) — Selene (kompozytor Wayland środowiska Luna).
# Target w repo receptur: de/selene/PAGBUILD.yaml
#
# Buduje się z TEGO SAMEGO tarballa co libluna, ale z własnego workspace'u `selene/`,
# więc `source`
# wskazuje ten sam plik `luna-${pkgver}.tar.gz` — w repo receptur trzymamy jego kopię
# również w tym katalogu (pagbuild kopiuje pliki z katalogu receptury do katalogu budowy).

pkgname: selene
pkgver: '0.0.5'
pkgrel: 1
pkgdesc: 'Selene — kompozytor Wayland środowiska Luna (czysty Rust, bez smithay): xdg-shell, layer-shell, SSD, DRM/KMS, schowek, DnD'
url: 'https://git.paganlinux.eu/luna.git'
arch: x86_64
license:
- GPL-3.0-or-later
depends:
- libxkbcommon
- dejavu-ttf
makedepends:
- rustc
source:
- luna-${pkgver}.tar.gz
- luna-session
- selene.desktop
sha256sums:
- __TARBALL_SHA256__
- __SESSION_SHA256__
- __DESKTOP_SHA256__
build: |
  cd luna-${pkgver}

  ( cd selene && cargo build --release --locked )
  install -Dm755 selene/target/release/selene "${PKGDIR}/usr/bin/selene"

  # Skrypt sesji + wpis wyboru sesji (SDDM/GDM → /usr/share/wayland-sessions).
  install -Dm755 ../luna-session "${PKGDIR}/usr/bin/luna-session"
  install -Dm644 ../selene.desktop "${PKGDIR}/usr/share/wayland-sessions/selene.desktop"

  # Tłumaczenia kompozytora (doładowywane w runtime z /usr/share/luna/i18n).
  install -d "${PKGDIR}/usr/share/luna/i18n"
  install -m644 libluna/crates/libluna-i18n/i18n/*.lang "${PKGDIR}/usr/share/luna/i18n/"

  install -Dm644 LICENSE "${PKGDIR}/usr/share/licenses/${pkgname}/LICENSE"
  install -Dm644 README.md "${PKGDIR}/usr/share/doc/${pkgname}/README.md"
package: |
  true

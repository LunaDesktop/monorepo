# Backend portali XDG dla sesji Luna (`xdg-desktop-portal`).
#
# `xdg-desktop-portal` dobiera backend po `XDG_CURRENT_DESKTOP` — szuka pliku
# `<desktop>-portals.conf` w `/usr/share/xdg-desktop-portal/`. Bez pliku dla Luny
# żaden backend nie pasuje i żądania portalu (np. z aplikacji flatpak, wybór pliku,
# `Settings`) kończą się przekroczeniem czasu oczekiwania.
#
# `gtk` to generyczny backend (FileChooser, Settings, Notification, Print, Access…).
# Gdy pojawi się natywny backend Luny (np. `xdg-desktop-portal-luna`), wystarczy go
# dopisać tutaj przed `gtk`.
[preferred]
default=gtk;

[package]
name = "selene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Selene — kompozytor Wayland środowiska Luna (bez smithay; własna implementacja na wayland-server)."

[[bin]]
name = "selene"
path = "src/main.rs"

[dependencies]
libluna-core.workspace = true
libluna-render.workspace = true
libluna-i18n.workspace = true
libluna-platform.workspace = true

wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
rustix = { version = "0.38", features = ["event", "fs", "time", "mm"] }

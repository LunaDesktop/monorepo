[package]
name = "luna"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Luna — powłoka środowiska graficznego (panel, launcher) na libLunie, działająca na kompozytorze Selene."

[lib]
name = "luna"
path = "src/lib.rs"

[[bin]]
name = "luna-panel"
path = "src/bin/luna-panel.rs"

[[bin]]
name = "luna-shell"
path = "src/bin/luna-shell.rs"

[[bin]]
name = "luna-apps"
path = "src/bin/luna-apps.rs"

[dependencies]
libluna-core.workspace = true
libluna-widgets.workspace = true
libluna-render.workspace = true
libluna-i18n.workspace = true
libluna-platform.workspace = true

wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5.12.0", features = ["blocking-api"] }

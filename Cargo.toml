# Meta-repozytorium Luna.
#
# libLuna, Luna, Selene, luna-greeter i aplikacje są TU niezależnymi workspace'ami
# Cargo — każdy ma własny Cargo.lock i można go otworzyć/zbudować osobno:
#
#   make build            # buduje wszystkie pakiety (wspólny target/)
#   make test             # testuje wszystkie pakiety
#   cd selene && cargo run
#   cd apps/luna-terminal && cargo build
#
# Ten manifest jest celowo pusty (żadnych członków): nie da się mieć jednego
# workspace'u Cargo, który jednocześnie zawiera inne workspace'y. Służy tylko
# temu, żeby `cargo` uruchomione w katalogu głównym nie kończyło się błędem.
[workspace]
resolver = "2"
members = []
